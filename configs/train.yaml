# Hiperparâmetros do treino completo.
# Usado por src/training/train.py quando NÃO está em modo smoke test.
#
# imgsz=960 (maior que o padrão 640): placas ocupam ~0.3% da área da imagem
# em mediana (ver outputs/reports/eda_summary.md) - objeto pequeno precisa
# de resolução de entrada maior pra ficar detectável.
#
# epochs=80: ajuste esse número ao tempo de GPU disponível na sua sessão -
# rode um smoke test primeiro (ver notebooks/kaggle_train.ipynb) pra medir
# o tempo por época antes de comprometer uma sessão longa.
#
# Caminho relativo à raiz do repo (src/training/train.py resolve como
# REPO_ROOT / model) - não ao diretório de onde o script é chamado.
model: weights/yolo11n.pt
imgsz: 960
epochs: 80
batch: 16
patience: 20
save_period: 10
name: full_run
